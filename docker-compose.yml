version: '3.9'
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: file:/data/dev.db
      JWT_SECRET: changeme
      NODE_ENV: production
      PORT: 4000
    volumes:
      - sqlite_data:/data
    ports:
      - "4000:4000"
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      - server
volumes:
  sqlite_data:
